<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Staff sign in / ESR</title><script src="theme.js"></script>
  <link rel="stylesheet" href="next.css">
  <style>body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}</style>
</head><body>
  <main class="loginPanel">
    <div class="missionKicker"><span></span> NS ENGINEERING / STAFF</div>
    <h1>Your work. One place.</h1>
    <p>Sign in with your engineering account to add projects and post updates.</p>
    <form id="staffLogin">
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" autocomplete="username" value="engineering@nswash.com" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="loginLinks"><button class="signInLink" id="signInButton" type="submit">Staff Sign In</button><a href="index.html">View dashboard</a></div>
      <p id="loginMessage" role="status" aria-live="polite"></p>
    </form>
  </main>
<script>
document.getElementById('staffLogin').addEventListener('submit',async event=>{
  event.preventDefault();
  const button=document.getElementById('signInButton');const message=document.getElementById('loginMessage');
  button.disabled=true;message.textContent='Signing in…';
  try {
    const response=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error || 'Could not sign in.');
    document.getElementById('password').value='';window.location.assign('/index.html');
  } catch(error){message.textContent=error.message;button.disabled=false;}
});
</script>
</body></html>
